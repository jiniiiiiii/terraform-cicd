# 0715 재업로두 1
name: was-cicd

on:
  push:
    branches:
      - dev
    paths: #특정 경로명이 올라왔을 때만 동작
      - "backend/**"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      # 1. 내 레포 소스코드를 통째로 다운함.
      - name: 1.1. 시작 메시지
        run: echo "@@@ 1. 소스코드 체크 아웃 @@@"

      - name: 1.2. 소스코드 체크아웃 실행
        uses: actions/checkout@v4

      - name: 2.1. aws 로그인 메시지
        run: echo "@@@ 2. aws 로그인 시도 @@@"

      - name: 2.2.aws 로그인
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-3 # 사용 중인 리전

      - name: 3. 파일 압축(zip)
        run: |
          echo "@@ 3. 기존에 있을 수도 있는 찌꺼기 파일을 삭제합니다...... "
          rm -rf ../lambda_function.zip ./lambda_function.zip

          echo "@@ 3. 업로드된 source 압축 수행 합니다..... "
          cd ./backend
          zip -r ../lambda_function.zip .
          echo "@@ 3. 업로드된 source 압축 완료! "
          echo "현재 작업 디렉토리" && pwd
          echo "파일 목록 : " && ls 
          #find / -name "lambda_function.zip" 2>/dev/null

      - name: 4. s3버킷으로 웹 소스 동기화
        # 처음에 | 써주면 여러줄 쓰기 가능
        run: |
          echo "@@@ 4. s3 배포를 시작합니다..... "
          echo "현재 작업 디렉토리" && pwd
          echo "파일 목록 : " && ls 
          aws s3 cp ./lambda_function.zip s3://aws-saa-qbank.was-cicd/lambda_function.zip  
          #aws s3 sync ./lambda_function.zip s3://aws-saa-qbank.was-cicd/lambda_function.zip  --delete
          #echo "@@@ 4. s3 배포를 마쳤습니다!! "

      - name: 5. new 버전 자동 배포
        run: |
          echo "@@@ 5. 새로운 버전의 파일이 배포되었습니다. 업데이트를 실행합니다. @@@"
          # 🌟 이 명령어가 실행되는 순간, 람다는 S3에서 방금 올린 zip을 끌어와 0.5초 만에 신규 코드로 갈아끼웁니다!
          aws lambda update-function-code \
            --function-name terraform-backend-api \
            --s3-bucket aws-saa-qbank.was-cicd \
            --s3-key lambda_function.zip

          echo "@@@ 5. 새로운 버전의 파일이 배포되었습니다! @@@"
