name: web-cicd

on:
    push:
        branches: ["dev"]
        paths: #특정 경로명이 올라왔을 때만 동작
            - "frontend/**"

jobs:
    deploy-frontend:
        runs-on: ubuntu-latest

        steps:
            # 1. 내 레포 소스코드를 통째로 다운함.
            - name: 1.1. 시작 메시지
              run: echo "@@@ 1. 소스코드 체크 아웃 @@@"

            - name: 1.2. 소스코드 체크아웃 실행
              uses: actions/checkout@v4

            - name: 2.1. aws 로그인 메시지
              run: echo "@@@ 2. aws 로그인 시도 @@@"

            - name: 2.2.aws 로그인
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ap-northeast-3 # 사용 중인 리전

            - name: 3. s3버킷으로 웹 소스 동기화
              # 처음에 | 써주면 여러줄 쓰기 가능
              run: |
                  echo "@@@ 3. s3 배포를 시작합니다. "
                  aws s3 sync ./web s3://aws-saa-qbank.front-cicd  --delete
                  echo "@@@ 4. s3 배포를 마쳤습니다!! "
