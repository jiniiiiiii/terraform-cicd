name: conf-cicd

on:
    push:
        branches:
            - dev
        paths:
            - "conf/**" # path -> paths 로 수정

jobs:
    deploy-conf:
        runs-on: ubuntu-latest

        steps:
            # 1. 소스코드 체크아웃
            - name: 1.1. 시작 메시지
              run: echo "@@@ 1. 소스코드 체크 아웃 @@@"

            - name: 1.2. 소스코드 체크아웃 실행
              uses: actions/checkout@v4

            # 2. AWS 로그인
            - name: 2.1. aws 로그인 메시지
              run: echo "@@@ 2. aws 로그인 시도 @@@"

            - name: 2.2. aws 로그인
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ap-northeast-3

            # 3. S3 버킷으로 설정 파일 동기화
            - name: 3. s3 버킷으로 웹 소스 동기화
              run: |
                  echo "@@@ 3. s3 배포를 시작합니다..... "
                  echo "현재 작업 디렉토리 : $(pwd)"
                  echo "파일 목록 :"
                  ls -la

                  # conf 폴더 안의 특정 api.conf 파일만 S3의 해당 경로로 복사
                  aws s3 cp conf/api.conf s3://aws-saa-qbank.conf-cicd/nginx/api.conf

                  echo "@@@ 3. s3 배포를 마쳤습니다!! "
